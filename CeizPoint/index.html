<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceiz Point</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        body {
            background: #f6f5e6;
        }

        .container {
            display: flex;
            max-width: 100vw;
            flex-direction: column;
        }

        button {
            background: none;
            border: none;
        }

        img:hover {
            box-shadow: 0px 0px 4px 2px #cc4e00;
        }

        .row {
            display: flex;
            flex-direction: row;
            max-height: 100vh;
            max-width: 100%;
            justify-content: center;
            align-items: center;
            height: 70%;
        }

        .row .join,
        .row .recommend {
            display: flex;
            width: 50%;
            margin: 8px;
        }

        img {
            display: flex;
            width: 100%;
        }
        a{
            display: flex;
            height: 30%;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row">

            <div class="join">
                <button data-tally-open="ZjeBNa" data-tally-emoji-text="👋" data-tally-emoji-animation="wave">
                    <img src="./Join.png" alt="">
                </button>

            </div>
            <div class="recommend">

                <button data-tally-open="jagbP4" data-tally-emoji-text="👋" data-tally-emoji-animation="wave"><img
                        src="./recommend.png" alt=""></button>

            </div>
            
        </div>
        <a href="/CeizPoint/Eugene/index.html">
                <img src="./Eugene/assets/Eugene Header.png" alt=""></a>
    </div>
</body>

</html>
